name: TCP Loopback Benchmark Conformance

on:
  push:
    branches: [main]
    paths:
      - 'include/**'
      - 'examples/bench_tcp_*.cpp'
      - 'examples/bench_tcp_common.hpp'
      - 'examples/bench_tcp_server_protocol.hpp'
      - 'examples/CMakeLists.txt'
      - 'tools/run-tcp-benchmark-conformance.py'
      - 'tools/run-tcp-performance-comparison.py'
      - 'CMakeLists.txt'
      - '*.cmake'
      - 'cmake/**'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo tee /etc/apt/apt.conf.d/99-elio-ci-network >/dev/null <<'APT'
          Acquire::Retries "5";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::ForceIPv4 "true";
          APT

          retry_sudo() {
            for attempt in 1 2 3 4 5; do
              if sudo "$@"; then
                return 0
              fi
              if [[ "${attempt}" == 5 ]]; then
                return 1
              fi
              sleep $((attempt * 5))
            done
          }

          retry_sudo apt-get update
          retry_sudo apt-get install -y libuv1-dev liburing-dev g++-14

      - name: Check benchmark runner syntax
        run: |
          python3 -m py_compile \
            tools/run-tcp-benchmark-conformance.py \
            tools/run-tcp-performance-comparison.py

      - name: Configure
        run: |
          cmake -S . -B build-tcp-benchmark \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DELIO_ENABLE_DEBUG_METADATA=OFF \
            -DELIO_BUILD_TESTS=OFF \
            -DELIO_BUILD_EXAMPLES=ON \
            -DELIO_ENABLE_TLS=OFF \
            -DELIO_ENABLE_HTTP=OFF \
            -DELIO_ENABLE_HTTP2=OFF \
            -DELIO_BUILD_TCP_BENCHMARKS=ON

      - name: Build conformance targets
        run: |
          cmake --build build-tcp-benchmark \
            --target bench_tcp_reference bench_tcp_reference_client \
              bench_tcp_elio bench_tcp_libuv bench_tcp_asio \
              bench_tcp_elio_server bench_tcp_libuv_server bench_tcp_asio_server \
            --parallel 2

      - name: Run fixed-work conformance smoke
        run: |
          python3 tools/run-tcp-benchmark-conformance.py \
            --reference-server ./build-tcp-benchmark/examples/bench_tcp_reference \
            --reference-client ./build-tcp-benchmark/examples/bench_tcp_reference_client \
            --elio-client ./build-tcp-benchmark/examples/bench_tcp_elio \
            --libuv-client ./build-tcp-benchmark/examples/bench_tcp_libuv \
            --asio-client ./build-tcp-benchmark/examples/bench_tcp_asio \
            --elio-server ./build-tcp-benchmark/examples/bench_tcp_elio_server \
            --libuv-server ./build-tcp-benchmark/examples/bench_tcp_libuv_server \
            --asio-server ./build-tcp-benchmark/examples/bench_tcp_asio_server \
            --output-dir tcp-benchmark-conformance

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tcp-benchmark-conformance-${{ github.sha }}
          path: tcp-benchmark-conformance/
          retention-days: 90
          if-no-files-found: warn

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## TCP loopback conformance smoke"
            echo
            echo "This public GitHub runner validates protocol conformance, fixed-work completion, accounting, and the single-writer invariant. It is not a controlled performance baseline, publishes no cross-library ranking, and applies no performance-ratio gate."
            echo
            if [[ -f tcp-benchmark-conformance/results.jsonl ]]; then
              result_count=$(wc -l < tcp-benchmark-conformance/results.jsonl)
              valid_count=$(grep -c '"valid": true' tcp-benchmark-conformance/results.jsonl || true)
              ineligible_count=$(grep -c '"performance_eligible": false' tcp-benchmark-conformance/results.jsonl || true)
              echo "Conformance cases: ${result_count}"
              echo "Valid cases: ${valid_count}/${result_count}"
              echo "Performance-eligible cases: $((result_count - ineligible_count))/${result_count} (expected 0)"
            else
              echo "Conformance results: missing"
            fi
            echo
            if [[ -f tcp-benchmark-conformance/server-evidence.jsonl ]]; then
              server_count=$(wc -l < tcp-benchmark-conformance/server-evidence.jsonl)
              server_valid_count=$(grep -c '"valid": true' tcp-benchmark-conformance/server-evidence.jsonl || true)
              echo "Server-observed evidence: ${server_valid_count}/${server_count} valid"
            else
              echo "Server-observed evidence: missing"
            fi
            echo
            if [[ -f tcp-benchmark-conformance/manifest.json ]]; then
              echo "Reproducibility manifest: present"
            else
              echo "Reproducibility manifest: missing"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
