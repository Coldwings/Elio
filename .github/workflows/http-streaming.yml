name: HTTP streaming contracts

on:
  pull_request:
    paths:
      - 'include/**'
      - 'tests/**'
      - 'examples/sse_server.cpp'
      - 'examples/http_streaming_server.cpp'
      - 'examples/http_connect_proxy.cpp'
      - '**/CMakeLists.txt'
      - 'cmake/**'
      - 'wiki/HTTP-Streaming.md'
      - 'wiki/API-Contracts.md'
      - 'wiki/API-Reference.md'
      - 'wiki/Migrating-to-0.6.md'
      - 'wiki/WebSocket-SSE.md'
      - 'wiki/HTTP2-Guide.md'
      - '.github/workflows/http-streaming.yml'
  push:
    branches: [main]
    paths:
      - 'include/**'
      - 'tests/**'
      - 'examples/sse_server.cpp'
      - 'examples/http_streaming_server.cpp'
      - 'examples/http_connect_proxy.cpp'
      - '**/CMakeLists.txt'
      - 'cmake/**'
      - 'wiki/HTTP-Streaming.md'
      - 'wiki/API-Contracts.md'
      - 'wiki/API-Reference.md'
      - 'wiki/Migrating-to-0.6.md'
      - 'wiki/WebSocket-SSE.md'
      - 'wiki/HTTP2-Guide.md'
      - '.github/workflows/http-streaming.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peer-and-examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install build and pinned peer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev liburing-dev python3-venv
          python3 -m venv "$RUNNER_TEMP/http-peer-env"
          "$RUNNER_TEMP/http-peer-env/bin/pip" install h11==0.16.0
      - name: Configure focused build
        run: |
          cmake -S . -B build-http-peer -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DELIO_BUILD_TESTS=ON -DELIO_BUILD_SANITIZER_TESTS=OFF \
            -DELIO_BUILD_EXAMPLES=ON -DELIO_ENABLE_TLS=ON \
            -DELIO_ENABLE_HTTP=ON -DELIO_ENABLE_HTTP2=OFF \
            -DELIO_ENABLE_RDMA=OFF -DELIO_BUILD_TCP_BENCHMARKS=OFF \
            -DELIO_ENABLE_DEVELOPER_WARNINGS=ON -DELIO_WARNINGS_AS_ERRORS=ON \
            -DELIO_BUILD_HTTP_INTEROP_TESTS=ON \
            -DPython3_EXECUTABLE="$RUNNER_TEMP/http-peer-env/bin/python"
      - name: Compile peer and documented examples
        id: build
        run: cmake --build build-http-peer --target elio_http_streaming_peer elio_http_connect_peer elio_http_streaming_cost_probe elio_http_streaming_transport_tests elio_public_header_examples sse_server http_streaming_server http_connect_proxy --parallel 2
      - name: Validate against h11
        id: peer
        run: |
          mkdir -p http-peer-results
          "$RUNNER_TEMP/http-peer-env/bin/python" tests/integration/http_streaming_peer.py \
            --server build-http-peer/tests/elio_http_streaming_peer \
            > http-peer-results/result.json 2> http-peer-results/runtime.log
      - name: Run canonical streaming example
        if: always() && steps.build.outcome == 'success'
        run: |
          "$RUNNER_TEMP/http-peer-env/bin/python" tests/integration/http_streaming_example.py \
            --server build-http-peer/examples/http_streaming_server \
            --output-dir http-peer-results/canonical-example
      - name: Validate independent CONNECT peers
        if: always() && steps.build.outcome == 'success'
        run: |
          "$RUNNER_TEMP/http-peer-env/bin/python" tests/integration/http_connect_peer.py \
            --server build-http-peer/tests/elio_http_connect_peer \
            --output-dir http-peer-results/connect
      - name: Publish CONNECT conformance summary
        if: always()
        run: |
          if test -f http-peer-results/connect/summary.md; then
            cat http-peer-results/connect/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## CONNECT conformance: no completed report' >> "$GITHUB_STEP_SUMMARY"
            echo 'Missing evidence is not a passing coordinate; inspect failed steps.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run canonical CONNECT proxy and graceful stop
        if: always() && steps.build.outcome == 'success'
        run: |
          "$RUNNER_TEMP/http-peer-env/bin/python" tests/integration/http_connect_example.py \
            --server build-http-peer/examples/http_connect_proxy \
            --output-dir http-peer-results/connect-example
      - name: Publish canonical CONNECT example summary
        if: always()
        run: |
          if test -f http-peer-results/connect-example/summary.md; then
            cat http-peer-results/connect-example/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## CONNECT example: no completed report' >> "$GITHUB_STEP_SUMMARY"
            echo 'Missing evidence is not a passing example; inspect failed steps.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run actual SSE example and graceful stop
        if: always() && steps.build.outcome == 'success'
        id: sse
        run: |
          "$RUNNER_TEMP/http-peer-env/bin/python" tests/integration/sse_example_smoke.py \
            --server build-http-peer/examples/sse_server \
            --output-dir http-peer-results/sse-example
      - name: Measure scoped HTTP allocation and borrowing invariants
        if: always() && steps.build.outcome == 'success'
        id: cost
        run: |
          mkdir -p http-peer-results
          build-http-peer/tests/elio_http_streaming_cost_probe \
            > http-peer-results/cost.json 2> http-peer-results/cost.log
      - name: Validate real transport lifecycle by backend
        if: always() && steps.build.outcome == 'success'
        run: |
          mkdir -p http-peer-results
          status=0
          for backend in epoll io_uring; do
            build-http-peer/tests/elio_http_streaming_transport_tests \
              --section "forced $backend" --rng-seed 652314797 --reporter junit \
              --out "http-peer-results/transport-$backend.xml" \
              > "http-peer-results/transport-$backend.log" 2>&1 || status=1
          done
          exit "$status"
      - name: Publish readable conformance summary
        if: always()
        env:
          PEER_OUTCOME: ${{ steps.peer.outcome }}
          COST_OUTCOME: ${{ steps.cost.outcome }}
          SSE_OUTCOME: ${{ steps.sse.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          incomplete_transport = False
          report = Path('http-peer-results/result.json')
          lines = ['## HTTP streaming interoperability', '',
                   'Peer: h11 0.16.0. Plain loopback only; not a performance comparison.', '',
                   f"Validation step: {os.environ['PEER_OUTCOME'] or 'not run'}", '']
          if report.exists() and report.stat().st_size:
              data = json.loads(report.read_text())
              lines += ['| Scenario | Result | Decoded body bytes |', '| --- | --- | ---: |']
              for row in data['scenarios']:
                  lines.append(f"| {row['scenario']} | {row['status']} | {row['body_bytes']} |")
          else:
              lines.append('No successful scenario report; inspect failed steps and retained logs.')
          canonical = Path('http-peer-results/canonical-example/result.json')
          lines += ['', '### Canonical streaming example', '']
          if canonical.exists():
              example = json.loads(canonical.read_text())
              lines += ['| Scenario | Result |', '| --- | --- |']
              for row in example['scenarios']:
                  lines.append(f"| {row['scenario']} | {'passed' if row['passed'] else 'failed'} |")
              if not example['success']:
                  lines.append('Example failed; inspect retained result and process logs.')
          else:
              lines.append('Not run or no completed report; not a passing example.')
          lines += ['', '### Actual SSE demo smoke', '',
                    'Runs examples/sse_server.cpp, not the finite SSE peer fixture.',
                    f"Demo step: {os.environ['SSE_OUTCOME'] or 'not run'}", '']
          sse = Path('http-peer-results/sse-example/result.json')
          if sse.exists():
              example = json.loads(sse.read_text())
              lines += ['| Scenario | Result |', '| --- | --- |']
              for row in example['scenarios']:
                  lines.append(f"| {row['scenario']} | {'passed' if row['passed'] else 'failed'} |")
              if not example['success']:
                  lines.append('SSE demo failed; inspect retained result and process logs.')
          else:
              lines.append('Not run or no completed report; not a passing SSE demo.')
          lines += ['', '### HTTP-layer allocation probe', '',
                    'Controlled discard sink, no network. Prepared payload storage and malloc-family bypasses are excluded.',
                    'Cumulative C++ allocation requests are not peak memory, transport throughput, or end-to-end copy totals.', '',
                    f"Probe step: {os.environ['COST_OUTCOME'] or 'not run'}", '']
          cost = Path('http-peer-results/cost.json')
          if cost.exists() and cost.stat().st_size:
              data = json.loads(cost.read_text())
              lines += ['| Mode | Body bytes | C++ allocations | Largest request | Payload-sized allocations |',
                        '| --- | ---: | ---: | ---: | ---: |']
              for row in data['rows']:
                  lines.append(f"| {row['mode']} | {row['body_bytes']} | {row['allocation_calls']} | {row['largest_allocation_bytes']} | {row['payload_sized_allocations']} |")
          lines += ['', '### Real TCP/TLS cancellation and timeout', '',
                    '| Forced backend | Result |', '| --- | --- |']
          for backend in ('epoll', 'io_uring'):
              report = Path(f'http-peer-results/transport-{backend}.xml')
              outcome = 'not run / no report'
              if report.exists() and report.stat().st_size:
                  cases = ET.parse(report).getroot().findall('.//testcase')
                  if any(c.find('failure') is not None or c.find('error') is not None for c in cases):
                      outcome = 'failed'
                  elif any(c.find('skipped') is not None for c in cases):
                      outcome = 'skipped (see backend availability evidence)'
                  else:
                      expected = {f'HTTP sender cleans up real backpressured borrowed TCP and TLS writes/forced {backend}/{scenario}'
                                  for scenario in ('TCP cancellation', 'TCP timeout', 'TLS cancellation', 'TLS timeout')}
                      observed = [c.get('name') for c in cases]
                      if len(observed) == 4 and set(observed) == expected:
                          outcome = 'passed (4/4 scenarios)'
                      else:
                          outcome = 'incomplete scenario coverage'
                          incomplete_transport = True
              lines.append(f'| {backend} | {outcome} |')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('\n'.join(lines) + '\n')
          if incomplete_transport:
              raise SystemExit('Transport report did not cover each expected scenario exactly once')
          PY
      - name: Retain peer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-streaming-peer
          path: http-peer-results/
          if-no-files-found: ignore

  transport-metrics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install diagnostic dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev liburing-dev python3-venv openssl
          python3 -m venv "$RUNNER_TEMP/http-metrics-env"
          "$RUNNER_TEMP/http-metrics-env/bin/pip" install h11==0.16.0
      - name: Configure release diagnostic fixture
        run: |
          cmake -S . -B "$RUNNER_TEMP/http-metrics-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DELIO_BUILD_TESTS=ON -DELIO_BUILD_SANITIZER_TESTS=OFF \
            -DELIO_BUILD_EXAMPLES=OFF -DELIO_ENABLE_TLS=ON \
            -DELIO_ENABLE_HTTP=ON -DELIO_ENABLE_HTTP2=OFF \
            -DELIO_ENABLE_RDMA=OFF -DELIO_BUILD_TCP_BENCHMARKS=OFF \
            -DELIO_ENABLE_DEVELOPER_WARNINGS=ON -DELIO_WARNINGS_AS_ERRORS=ON \
            -DELIO_BUILD_HTTP_METRICS=ON \
            -DPython3_EXECUTABLE="$RUNNER_TEMP/http-metrics-env/bin/python"
      - name: Compile real transport fixture
        run: cmake --build "$RUNNER_TEMP/http-metrics-build" --target elio_http_streaming_metrics_server --parallel 2
      - name: Test evidence validation
        run: ctest --test-dir "$RUNNER_TEMP/http-metrics-build" -R '^http_streaming_metrics_(report|failure)_tests$' --output-on-failure
      - name: Measure verified loopback pipelines
        run: |
          "$RUNNER_TEMP/http-metrics-env/bin/python" tests/integration/http_streaming_metrics.py \
            --server "$RUNNER_TEMP/http-metrics-build/tests/elio_http_streaming_metrics_server" \
            --output-dir "$RUNNER_TEMP/http-metrics-results"
      - name: Publish diagnostic summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/http-metrics-results/summary.md"; then
            cat "$RUNNER_TEMP/http-metrics-results/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## HTTP transport diagnostics: no completed report' >> "$GITHUB_STEP_SUMMARY"
            echo 'Inspect failed steps; missing evidence is not a passing coordinate.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain real transport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-streaming-transport-metrics
          path: |
            ${{ runner.temp }}/http-metrics-results/
            ${{ runner.temp }}/http-metrics-build/tests/http-metrics-failures/
          if-no-files-found: ignore
