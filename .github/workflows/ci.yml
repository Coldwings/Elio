name: CI

on:
  push:
    branches: [ main, develop, 'release/**' ]
  pull_request:
    branches: [ main, develop, 'release/**' ]

permissions:
  contents: read
  pull-requests: read

jobs:
  # Detect which files changed to conditionally run expensive CI jobs
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      tcp_benchmark: ${{ steps.filter.outputs.tcp_benchmark }}
      readme: ${{ steps.filter.outputs.readme }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Check for code changes
      uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          readme:
            - 'README.md'
          code:
            - 'include/**'
            - 'tests/**'
            - 'examples/**'
            - 'CMakeLists.txt'
            - '*.cmake'
            - 'cmake/**'
            - 'tools/**'
            - '.github/workflows/**'
          tcp_benchmark:
            - 'include/**'
            - 'examples/bench_tcp_*.cpp'
            - 'examples/bench_tcp_common.hpp'
            - 'examples/bench_tcp_server_protocol.hpp'
            - 'examples/CMakeLists.txt'
            - 'tools/run-tcp-benchmark-conformance.py'
            - 'tools/run-tcp-performance-comparison.py'
            - 'tests/unit/test_tcp_benchmark_conformance_summary.py'
            - 'CMakeLists.txt'
            - '*.cmake'
            - 'cmake/**'
            - '.github/workflows/**'

  readme-example:
    needs: changes
    if: needs.changes.outputs.readme == 'true' && needs.changes.outputs.code != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Configure core-only example validation
        run: |
          cmake -S . -B "$RUNNER_TEMP/readme-build" \
            -DCMAKE_BUILD_TYPE=Debug -DELIO_BUILD_TESTS=ON \
            -DELIO_BUILD_SANITIZER_TESTS=OFF -DELIO_BUILD_EXAMPLES=ON \
            -DELIO_ENABLE_TLS=OFF -DELIO_ENABLE_HTTP=OFF \
            -DELIO_ENABLE_HTTP2=OFF -DELIO_ENABLE_RDMA=OFF
      - name: Compile and run the exact README example
        run: |
          cmake --build "$RUNNER_TEMP/readme-build" --target first_coroutine --parallel 2
          ctest --test-dir "$RUNNER_TEMP/readme-build" -R '^readme_first_coroutine$' --no-tests=error --output-on-failure

  build-and-test:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        arch:
          - { name: x64, runner: ubuntu-24.04 }
          - { name: arm64, runner: ubuntu-24.04-arm }

    runs-on: ${{ matrix.arch.runner }}
    name: ${{ matrix.arch.name }}-${{ matrix.build_type }}

    steps:
    - name: Skip non-code changes
      if: needs.changes.outputs.code != 'true'
      run: echo "No code changes detected; CI matrix job intentionally skipped."

    - name: Checkout repository
      if: needs.changes.outputs.code == 'true'
      uses: actions/checkout@v7

    - name: Install dependencies
      if: needs.changes.outputs.code == 'true'
      run: |
        sudo tee /etc/apt/apt.conf.d/99-elio-ci-network >/dev/null <<'APT'
        Acquire::Retries "5";
        Acquire::http::Timeout "30";
        Acquire::https::Timeout "30";
        Acquire::ForceIPv4 "true";
        APT

        retry_sudo() {
          for attempt in 1 2 3 4 5; do
            if sudo "$@"; then
              return 0
            fi
            if [[ "${attempt}" == 5 ]]; then
              return 1
            fi
            sleep $((attempt * 5))
          done
        }

        retry_sudo apt-get update
        retry_sudo apt-get install -y \
          cmake \
          ninja-build \
          liburing-dev \
          libssl-dev \
          libibverbs-dev \
          librdmacm-dev \
          g++-14

    - name: Configure CMake
      if: needs.changes.outputs.code == 'true'
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_C_COMPILER=gcc-14 \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DELIO_BUILD_TESTS=ON \
          -DELIO_BUILD_SANITIZER_TESTS=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }} \
          -DELIO_BUILD_EXAMPLES=ON \
          -DELIO_ENABLE_TLS=ON \
          -DELIO_ENABLE_HTTP=ON \
          -DELIO_ENABLE_HTTP2=ON \
          -DELIO_ENABLE_RDMA=ON \
          -DELIO_ENABLE_RDMA_CM=ON \
          -DELIO_ENABLE_RDMA_IBVERBS=ON

    - name: Build
      if: needs.changes.outputs.code == 'true'
      run: cmake --build build --parallel

    - name: Run unit tests
      if: needs.changes.outputs.code == 'true'
      shell: bash
      run: |
        set -o pipefail
        mkdir -p test-logs
        ./build/tests/elio_tests --reporter compact --abort 2>&1 \
          | tee test-logs/catch-normal.log

    - name: Run ASAN tests
      if: needs.changes.outputs.code == 'true' && matrix.build_type == 'Debug'
      shell: bash
      run: |
        set -o pipefail
        ./build/tests/elio_tests_asan --reporter compact --abort 2>&1 \
          | tee test-logs/catch-asan.log
      env:
        ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:log_path=${{ github.workspace }}/test-logs/asan-${{ matrix.arch.name }}-${{ matrix.build_type }}

    - name: Run TSAN tests
      if: needs.changes.outputs.code == 'true' && matrix.build_type == 'Debug'
      shell: bash
      run: |
        set -o pipefail
        ./build/tests/elio_tests_tsan --reporter compact --abort 2>&1 \
          | tee test-logs/catch-tsan.log
      env:
        TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:log_path=${{ github.workspace }}/test-logs/tsan-${{ matrix.arch.name }}-${{ matrix.build_type }}

    - name: Run registered CTest checks
      if: needs.changes.outputs.code == 'true' && matrix.arch.name == 'x64' && matrix.build_type == 'Debug'
      run: |
        required_ctest_checks=(
          package_rdma_cuda_export_metadata
          rdma_cuda_example_api_metadata
          package_liburing_export_metadata
          package_threads_export_metadata
          package_rdma_dependency_export_metadata
          package_elio_compile_feature_export
          http2_fetchcontent_cache_scope
          http2_option_requires_http
          package_version_compatibility
          non_linux_platform_rejected
          tcp_benchmark_conformance_summary
          readme_first_coroutine
          elio_fork_boundary
          elio_fork_boundary_asan
          "endpoint comp channel fds are made non-blocking"
        )

        ctest --test-dir build -N
        for check_name in "${required_ctest_checks[@]}"; do
          if ! ctest --test-dir build -N -R "^${check_name}$" | grep -q "${check_name}"; then
            echo "::error title=Missing CTest check::${check_name} is not registered"
            exit 1
          fi
        done

        ctest --test-dir build --output-on-failure \
          -R "^(package_rdma_cuda_export_metadata|rdma_cuda_example_api_metadata|package_liburing_export_metadata|package_threads_export_metadata|package_rdma_dependency_export_metadata|package_elio_compile_feature_export|http2_fetchcontent_cache_scope|http2_option_requires_http|package_version_compatibility|non_linux_platform_rejected|tcp_benchmark_conformance_summary|readme_first_coroutine|elio_fork_boundary|elio_fork_boundary_asan|endpoint comp channel fds are made non-blocking)$"

        for test_binary in ./build/tests/elio_rdma_cuda_lifetime_tests; do
          if [[ ! -x "${test_binary}" ]]; then
            echo "::error title=Missing test binary::${test_binary} was not built"
            exit 1
          fi
          "${test_binary}"
        done
      env:
        ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:log_path=${{ github.workspace }}/test-logs/asan-${{ matrix.arch.name }}-${{ matrix.build_type }}-ctest

    - name: Run benchmark
      if: needs.changes.outputs.code == 'true' && matrix.build_type == 'Release'
      run: timeout --kill-after=10s 5m ./build/examples/benchmark

    - name: Run channel benchmark
      if: needs.changes.outputs.code == 'true' && matrix.build_type == 'Release'
      run: timeout --kill-after=10s 5m ./build/examples/bench_channel

    - name: Run scheduler service benchmark smoke test
      if: needs.changes.outputs.code == 'true' && matrix.build_type == 'Release'
      run: timeout --kill-after=5s 30s ./build/examples/scheduler_service_benchmark --smoke

    - name: Run shared mutex reader benchmark smoke test
      if: needs.changes.outputs.code == 'true' && matrix.build_type == 'Release'
      run: timeout --kill-after=5s 30s ./build/examples/shared_mutex_reader_benchmark --smoke

    - name: Run join destruction benchmark smoke test
      if: needs.changes.outputs.code == 'true' && matrix.build_type == 'Release'
      run: timeout --kill-after=5s 30s ./build/examples/bench_join_destroy_atomic --smoke

    - name: Run autoscaler example smoke test
      if: needs.changes.outputs.code == 'true' && matrix.build_type == 'Release'
      run: timeout --kill-after=5s 15s ./build/examples/autoscaler_example --smoke

    - name: Upload failing test evidence
      if: failure() && needs.changes.outputs.code == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: test-failure-logs-${{ matrix.arch.name }}-${{ matrix.build_type }}
        path: test-logs/
        if-no-files-found: warn

  package-consumer-check:
    needs: changes
    runs-on: ubuntu-24.04
    name: package-consumer-check

    steps:
    - name: Skip non-code changes
      if: needs.changes.outputs.code != 'true'
      run: echo "No code changes detected; package consumer check intentionally skipped."

    - name: Checkout repository
      if: needs.changes.outputs.code == 'true'
      uses: actions/checkout@v7

    - name: Install dependencies
      if: needs.changes.outputs.code == 'true'
      run: |
        sudo tee /etc/apt/apt.conf.d/99-elio-ci-network >/dev/null <<'APT'
        Acquire::Retries "5";
        Acquire::http::Timeout "30";
        Acquire::https::Timeout "30";
        Acquire::ForceIPv4 "true";
        APT

        retry_sudo() {
          for attempt in 1 2 3 4 5; do
            if sudo "$@"; then
              return 0
            fi
            if [[ "${attempt}" == 5 ]]; then
              return 1
            fi
            sleep $((attempt * 5))
          done
        }

        retry_sudo apt-get update
        retry_sudo apt-get install -y \
          cmake \
          ninja-build \
          liburing-dev \
          libssl-dev \
          libnghttp2-dev \
          g++-14

    - name: Configure CMake (installable build)
      if: needs.changes.outputs.code == 'true'
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=gcc-14 \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DELIO_BUILD_TESTS=OFF \
          -DELIO_BUILD_EXAMPLES=OFF \
          -DELIO_ENABLE_TLS=ON \
          -DELIO_ENABLE_HTTP=ON \
          -DELIO_ENABLE_HTTP2=ON

    - name: Build and install
      if: needs.changes.outputs.code == 'true'
      run: |
        cmake --build build --parallel
        cmake --install build --prefix ${{ github.workspace }}/_install

    - name: Verify package version compatibility
      if: needs.changes.outputs.code == 'true'
      run: |
        cmake \
          -DELIO_VERSION_FILE=${{ github.workspace }}/_install/lib/cmake/Elio/ElioConfigVersion.cmake \
          -P tests/cmake/check_elio_version_compatibility.cmake

    - name: Verify downstream consumption
      if: needs.changes.outputs.code == 'true'
      run: |
        mkdir -p consumer
        cat > consumer/CMakeLists.txt << 'EOF'
        cmake_minimum_required(VERSION 3.20)
        project(ElioConsumer LANGUAGES CXX)
        set(CMAKE_CXX_STANDARD 20)

        find_package(Elio REQUIRED)

        add_executable(consumer main.cpp)
        foreach(required_target IN ITEMS
            Elio::elio_tls
            Elio::elio_http
            Elio::elio_http2)
          if(NOT TARGET ${required_target})
            message(FATAL_ERROR "Expected installed target ${required_target}")
          endif()
        endforeach()

        target_link_libraries(consumer PRIVATE
          Elio::elio
          Elio::elio_tls
          Elio::elio_http
          Elio::elio_http2)
        target_compile_definitions(consumer PRIVATE
          ELIO_HAS_TLS_TARGET=1
          ELIO_HAS_HTTP_TARGET=1
          ELIO_HAS_HTTP2_TARGET=1)
        EOF

        cat > consumer/main.cpp << 'EOF'
        #include <elio/elio.hpp>
        #if defined(ELIO_HAS_TLS_TARGET)
        #include <elio/tls/tls.hpp>
        #endif
        #if defined(ELIO_HAS_HTTP_TARGET)
        #include <elio/http/http.hpp>
        #endif
        #if defined(ELIO_HAS_HTTP2_TARGET)
        #include <elio/http/http2.hpp>
        #endif

        int main() {
            return 0;
        }
        EOF

        cmake -S consumer -B consumer/build -G Ninja \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/_install
        cmake --build consumer/build --parallel

  tcp-benchmark-compile:
    needs: changes
    runs-on: ubuntu-24.04
    name: tcp-benchmark-compile
    timeout-minutes: 15

    steps:
    - name: Skip TCP benchmark compile
      if: needs.changes.outputs.tcp_benchmark != 'true'
      run: echo "No TCP benchmark-affecting changes detected; compile check intentionally skipped."

    - name: Checkout repository
      if: needs.changes.outputs.tcp_benchmark == 'true'
      uses: actions/checkout@v7

    - name: Install dependencies
      id: tcp_dependencies
      if: needs.changes.outputs.tcp_benchmark == 'true'
      run: |
        sudo tee /etc/apt/apt.conf.d/99-elio-ci-network >/dev/null <<'APT'
        Acquire::Retries "5";
        Acquire::http::Timeout "30";
        Acquire::https::Timeout "30";
        Acquire::ForceIPv4 "true";
        APT

        retry_sudo() {
          for attempt in 1 2 3 4 5; do
            if sudo "$@"; then
              return 0
            fi
            if [[ "${attempt}" == 5 ]]; then
              return 1
            fi
            sleep $((attempt * 5))
          done
        }

        retry_sudo apt-get update
        retry_sudo apt-get install -y \
          cmake \
          ninja-build \
          liburing-dev \
          libuv1-dev \
          g++-14

    - name: Check TCP benchmark runner syntax
      id: tcp_runner_syntax
      if: needs.changes.outputs.tcp_benchmark == 'true'
      run: |
        python3 -m py_compile \
          tools/run-tcp-benchmark-conformance.py \
          tools/run-tcp-performance-comparison.py

    - name: Configure TCP benchmark build
      id: tcp_configure
      if: needs.changes.outputs.tcp_benchmark == 'true'
      run: |
        cmake -B build-tcp-benchmark -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=gcc-14 \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DELIO_BUILD_TESTS=OFF \
          -DELIO_BUILD_EXAMPLES=ON \
          -DELIO_ENABLE_TLS=OFF \
          -DELIO_ENABLE_HTTP=OFF \
          -DELIO_ENABLE_HTTP2=OFF \
          -DELIO_BUILD_TCP_BENCHMARKS=ON

    - name: Build TCP benchmark targets
      id: tcp_build
      if: needs.changes.outputs.tcp_benchmark == 'true'
      run: |
        cmake --build build-tcp-benchmark \
          --target bench_tcp_reference bench_tcp_reference_client \
            bench_tcp_elio bench_tcp_libuv bench_tcp_asio \
            bench_tcp_elio_server bench_tcp_libuv_server bench_tcp_asio_server \
          --parallel 2

    - name: Run TCP benchmark conformance smoke
      id: tcp_conformance
      if: needs.changes.outputs.tcp_benchmark == 'true'
      run: |
        python3 tools/run-tcp-benchmark-conformance.py \
          --reference-server ./build-tcp-benchmark/examples/bench_tcp_reference \
          --reference-client ./build-tcp-benchmark/examples/bench_tcp_reference_client \
          --elio-client ./build-tcp-benchmark/examples/bench_tcp_elio \
          --libuv-client ./build-tcp-benchmark/examples/bench_tcp_libuv \
          --asio-client ./build-tcp-benchmark/examples/bench_tcp_asio \
          --elio-server ./build-tcp-benchmark/examples/bench_tcp_elio_server \
          --libuv-server ./build-tcp-benchmark/examples/bench_tcp_libuv_server \
          --asio-server ./build-tcp-benchmark/examples/bench_tcp_asio_server \
          --output-dir tcp-benchmark-conformance

    - name: Upload TCP benchmark conformance evidence
      id: tcp_conformance_artifact
      if: always() && needs.changes.outputs.tcp_benchmark == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: tcp-benchmark-conformance
        path: tcp-benchmark-conformance/
        if-no-files-found: warn

    - name: Publish TCP benchmark conformance summary
      if: always() && needs.changes.outputs.tcp_benchmark == 'true'
      shell: bash
      env:
        DEPENDENCIES_OUTCOME: ${{ steps.tcp_dependencies.outcome }}
        RUNNER_SYNTAX_OUTCOME: ${{ steps.tcp_runner_syntax.outcome }}
        CONFIGURE_OUTCOME: ${{ steps.tcp_configure.outcome }}
        BUILD_OUTCOME: ${{ steps.tcp_build.outcome }}
        CONFORMANCE_OUTCOME: ${{ steps.tcp_conformance.outcome }}
        ARTIFACT_URL: ${{ steps.tcp_conformance_artifact.outputs.artifact-url }}
      run: |
        {
          if [[ -f tcp-benchmark-conformance/summary.md ]]; then
            cat tcp-benchmark-conformance/summary.md
          else
            echo "## TCP loopback conformance smoke"
            echo
            echo "> [!WARNING]"
            echo "> The runner-generated summary is unavailable. No conformance result can be inferred from this fallback."
            echo
            echo "| Stage | Outcome |"
            echo "|---|---|"
            echo "| Dependencies | ${DEPENDENCIES_OUTCOME:-not-run} |"
            echo "| Runner syntax | ${RUNNER_SYNTAX_OUTCOME:-not-run} |"
            echo "| Configure | ${CONFIGURE_OUTCOME:-not-run} |"
            echo "| Build | ${BUILD_OUTCOME:-not-run} |"
            echo "| Conformance runner | ${CONFORMANCE_OUTCOME:-not-run} |"
          fi
          if [[ -n "${ARTIFACT_URL}" ]]; then
            echo
            echo "[Download the complete conformance evidence artifact](${ARTIFACT_URL})."
          fi
        } >> "$GITHUB_STEP_SUMMARY"
